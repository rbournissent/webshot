<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebShot Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">WebShot</span>
          <span class="brand-badge">PRO</span>
        </div>
      </div>
      <div class="shortcut-badge" title="Quick keyboard shortcut">
        <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>
      </div>
    </header>

    <!-- Status Bar (Shown when capture is active) -->
    <div id="activeBanner" class="active-banner hidden">
      <div class="pulse-indicator"></div>
      <span>Capturing in progress...</span>
      <button id="btnQuickStop" class="btn-quick-stop">Stop & Edit</button>
    </div>

    <!-- Capture Mode Cards -->
    <div class="section-title">Select Capture Mode</div>
    <div class="mode-grid">
      <!-- Mode 1: Continuous (Default) -->
      <label class="mode-card active" data-mode="continuous">
        <input type="radio" name="captureMode" value="continuous" checked>
        <div class="mode-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M19 12l-7 7-7-7"/>
            <circle cx="12" cy="5" r="2"/>
          </svg>
        </div>
        <div class="mode-info">
          <div class="mode-title">
            <span>Continuous Scroll</span>
            <span class="pill-rec">Default</span>
          </div>
          <p class="mode-desc">Auto-scrolls webpage until you click Stop or hit Esc</p>
        </div>
      </label>

      <!-- Mode 2: Auto Full Page -->
      <label class="mode-card" data-mode="full">
        <input type="radio" name="captureMode" value="full">
        <div class="mode-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 9h18M9 21V9"/>
          </svg>
        </div>
        <div class="mode-info">
          <div class="mode-title">Entire Full Page</div>
          <p class="mode-desc">Automatically scrolls to the end of the document</p>
        </div>
      </label>

      <!-- Mode 3: Visible Area -->
      <label class="mode-card" data-mode="visible">
        <input type="radio" name="captureMode" value="visible">
        <div class="mode-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div class="mode-info">
          <div class="mode-title">Visible Area</div>
          <p class="mode-desc">Instant snapshot of the current view without scrolling</p>
        </div>
      </label>
    </div>

    <!-- Capture Settings Accordion -->
    <details class="settings-accordion">
      <summary class="accordion-header">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Capture & Stitch Settings</span>
        <span class="chevron">▾</span>
      </summary>
      <div class="settings-body">
        <div class="setting-row">
          <div class="setting-text">
            <span class="setting-label">Scroll Speed / Delay</span>
            <span class="setting-sub">Allows lazy images to load</span>
          </div>
          <select id="scrollDelay" class="custom-select">
            <option value="200">Fast (200ms)</option>
            <option value="350" selected>Standard (350ms)</option>
            <option value="600">Deep Lazy-Load (600ms)</option>
          </select>
        </div>
        <div class="setting-row">
          <div class="setting-text">
            <span class="setting-label">Hide Sticky Headers</span>
            <span class="setting-sub">Avoids duplicate header bars</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="toggleHideFixed" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </details>

    <!-- Error message alert -->
    <div id="errorMessage" class="error-banner hidden"></div>

    <!-- Main Trigger Button -->
    <button id="btnStartCapture" class="btn-primary">
      <div class="btn-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="10 8 16 12 10 16 10 8"></polygon>
        </svg>
      </div>
      <span id="btnLabel">Start Auto-Scroll & Capture</span>
    </button>

    <!-- Footer -->
    <footer class="footer">
      <span>Auto-scrolls & stitches into high-res JPG crop editor</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
